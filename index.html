<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Burner PWA</title>
    <style>
        body { background: #0a0a0a; color: #00ff66; font-family: monospace; padding: 20px; text-align: center; }
        button { background: #ff3333; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 0 15px rgba(255,51,51,0.4); }
        button:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }
        .log-box { background: #111; border: 1px solid #00ff66; padding: 15px; margin: 20px auto; max-width: 500px; text-align: left; font-size: 13px; line-height: 1.5; box-shadow: inset 0 0 10px #000; }
        .stat { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding: 5px 0; }
        canvas { width: 100%; max-width: 500px; height: 100px; background: #000; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>🔥 CRYPTO-WASM MATRIX BURNER 🔥</h2>
    <p>Имитация Wasm-майнинга Scrypt/Cryptonight для максимального износа батареи.</p>
    
    <button id="startBtn">ЗАПУСТИТЬ МАЙНИНГ-ПОТОКИ</button>

    <div class="log-box">
        <div class="stat"><span>Wake Lock (Экран):</span><span id="wakeLock" style="color: #ff3333;">ВЫКЛ</span></div>
        <div class="stat"><span>Майнинг-потоки (Workers):</span><span id="threads">0</span></div>
        <div class="stat"><span>Вычислено хэшей:</span><span id="hashCount">0</span></div>
        <div class="stat"><span>Нагрузка на ОЗУ:</span><span id="ramLoad">0 MB</span></div>
        <div class="stat"><span>GPU Отрисовка:</span><span id="gpuStatus">0 FPS</span></div>
    </div>

    <canvas id="matrixCanvas"></canvas>

    <script>
        const startBtn = document.getElementById('startBtn');
        const hashCountEl = document.getElementById('hashCount');
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let totalHashes = 0;
        let isRunning = false;

        // Размеры canvas фиксируем жестко, чтобы ресайз внутри цикла не тратил ресурсы CPU
        canvas.width = 500;
        canvas.height = 100;

        // --- Ультимативный стресс-скрипт для Web Worker ---
        const minerScript = `
            self.onmessage = function(e) {
                if (e.data !== 'start') return;

                // Выделяем память (8MB) под тяжелые промахи кэша процессора
                const memoryGobbler = new Uint32Array(1024 * 1024 * 2);
                for (let i = 0; i < memoryGobbler.length; i++) {
                    memoryGobbler[i] = Math.sin(i) * 100000;
                }

                let r = Math.random();

                function heavyBurner() {
                    // Честный бесконечный цикл вычислений внутри микротаски. 
                    // Он нагружает ядро процессора на 100% без пауз.
                    while (true) {
                        for (let i = 0; i < 100000; i++) {
                            // Тяжелая тригонометрия + предотвращение NaN (+0.1)
                            r = Math.tan(Math.log(Math.abs(r) + 0.1)) * Math.cos(r);
                            let idx = Math.abs(Math.floor(r)) % memoryGobbler.length;
                            memoryGobbler[idx] ^= i;
                        }

                        // Передаем порцию данных в интерфейс
                        self.postMessage({type: 'hash', count: 100000});

                        // queueMicrotask передает управление циклу событий на микросекунду,
                        // позволяя postMessage уйти в основной поток, но мгновенно возвращает 100% нагрузку
                        queueMicrotask(heavyBurner);
                        break; 
                    }
                }
                heavyBurner();
            };
        `;

        const blob = new Blob([minerScript], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        // Функция удержания экрана
        async function initWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    await navigator.wakeLock.request('screen');
                    document.getElementById('wakeLock').textContent = 'АКТИВЕН (100% яркость)';
                    document.getElementById('wakeLock').style.color = '#00ff66';
                } catch (e) {}
            } else {
                document.getElementById('wakeLock').textContent = 'НЕ ПОДДЕРЖИВАЕТСЯ';
            }
        }

        // Эффект "Матрицы" на Canvas для жесткой нагрузки на GPU
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function renderMatrix() {
            if (!isRunning) return;
            
            // Нагружаем GPU отрисовкой тысяч мелких примитивов каждый кадр
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Шлейф затухания
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 3000; i++) {
                ctx.fillStyle = `rgba(0, ${Math.floor(Math.random() * 155) + 100}, 0, 0.8)`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }

            // Корректный расчет FPS (усредненный за секунду, без деления на 0)
            frameCount++;
            const now = performance.now();
            if (now - lastFpsUpdate >= 1000) {
                document.getElementById('gpuStatus').textContent = Math.round((frameCount * 1000) / (now - lastFpsUpdate)) + ' FPS';
                frameCount = 0;
                lastFpsUpdate = now;
            }
            
            requestAnimationFrame(renderMatrix);
        }

        // Запуск
        startBtn.addEventListener('click', async () => {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;
            startBtn.textContent = 'ТЕСТ ЗАПУЩЕН (МАКС НАГРУЗКА)';

            await initWakeLock();

            // Определяем ядра процессора (утилизируем ВСЕ доступные потоки устройства)
            const cores = navigator.hardwareConcurrency || 4;
            document.getElementById('threads').textContent = cores;
            document.getElementById('ramLoad').textContent = (cores * 8) + ' MB';

            // Разворачиваем потоки-"майнеры"
            for (let i = 0; i < cores; i++) {
                const worker = new Worker(workerUrl);
                worker.onmessage = function(e) {
                    if (e.data.type === 'hash') {
                        totalHashes += e.data.count;
                        hashCountEl.textContent = totalHashes.toLocaleString();
                    }
                };
                worker.postMessage('start');
            }

            lastFpsUpdate = performance.now();
            renderMatrix();
        });
    </script>
</body>
</html>
